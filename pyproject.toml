[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read (and optionally write) your Garmin Connect data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.3.0",
    "garminconnect[workout]==0.3.17",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
garmin-mcp = "garmin_mcp.__main__:main"
garmin-mcp-login = "garmin_mcp.login_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
