# Fly.io config. Change `app` to a unique name, then see README "Deploy to Fly.io".
app = "garmin-mcp-CHANGE-ME"
primary_region = "fra"

[build]

[env]
  GARMIN_TOKEN_DIR = "/data/tokens"
  GARMIN_ALLOW_WRITES = "false"

[[mounts]]
  source = "garmin_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
